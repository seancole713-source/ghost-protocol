<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{% block title %}Ghost{% endblock %}</title>
<link rel="stylesheet" href="/static/ghost.css" />
{% block head_extra %}{% endblock %}
</head>
<body>
<header class="navbar">
  <div class="brand">👻 GHOST</div>
  <nav>
    <a href="/" class="{% if active=='cockpit' %}active{% endif %}">Cockpit</a>
    <a href="/engine" class="{% if active=='engine' %}active{% endif %}">Engine</a>
    <a href="/bank" class="{% if active=='bank' %}active{% endif %}">Bank</a>
    <a href="/security" class="{% if active=='security' %}active{% endif %}">Security</a>
    <a href="/brain" class="{% if active=='brain' %}active{% endif %}">Brain</a>
  <a href="/healthpage" class="{% if active=='health' %}active{% endif %}">Health</a>
    <a href="/markets" class="{% if active=='markets' %}active{% endif %}">Markets</a>
    <a href="/monthly" class="{% if active=='monthly' %}active{% endif %}">Monthly</a>
  </nav>
  <div class="spacer"></div>
  <div id="health-banner" class="health health-loading" title="Health status loading…">Loading health…</div>
  <button class="btn btn-danger" onclick="emergencyStop()" title="Emergency Stop">Emergency</button>
</header>
{% block content %}{% endblock %}
<script id="ghost-config" type="application/json">{{ (config|default({})) | tojson | safe }}</script>
<script>
// Parse injected runtime config
try { window.__CONFIG__ = JSON.parse(document.getElementById('ghost-config').textContent || '{}'); } catch(e) { window.__CONFIG__ = { refresh:{engine:30000,markets:60000,cockpit:60000}, features:{ live_prices:false, advisory_only:true } }; }
function emergencyStop(){
 fetch('/agent/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({execution_enabled:false,advisory_only:true})}).then(()=>alert('Emergency stop engaged.'))
}
// Health banner logic
async function refreshHealthBanner(){
  const el = document.getElementById('health-banner');
  if(!el) return;
  try {
    const res = await fetch('/api/secrets/health');
    const data = await res.json();
    const present = data.present || {};
    const checks = data.checks || {};
    const requiredOk = !!present.COINGECKO_API_KEY && !!present.ALPHAVANTAGE_API_KEY;
    const probesOk = checks.coingecko_batch === true && checks.yfinance_aapl === true;
    const redisOk = data.redis_up === true;
    let state = 'warn', msg = 'Partial';
    if (requiredOk && probesOk) { state = redisOk ? 'ok' : 'warn'; msg = redisOk ? 'All good' : 'OK (no Redis)'; }
    if (!requiredOk || !probesOk) { state = 'bad'; msg = 'Degraded'; }
    el.className = `health health-${state}`;
    el.textContent = `Health: ${msg}`;
    el.title = `coingecko:${present.COINGECKO_API_KEY?'✓':'×'} alphaV:${present.ALPHAVANTAGE_API_KEY?'✓':'×'} telegram:${present.TELEGRAM_BOT_TOKEN?'✓':'×'} redis:${redisOk?'✓':'×'}`;
  } catch(e){
    const el = document.getElementById('health-banner');
    if(el){ el.className = 'health health-bad'; el.textContent = 'Health: error'; el.title = String(e); }
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  refreshHealthBanner();
  setInterval(refreshHealthBanner, 30000);
});
</script>
{% block scripts %}{% endblock %}
<script src="/static/ghost.js"></script>
</body>
</html>
