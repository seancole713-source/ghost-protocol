<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine — Signals • Allocations • Orders</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; }
    header { padding:1rem 1.5rem; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; }
    a { color:#38bdf8; text-decoration:none; }
    main { padding:1rem 1.5rem; display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .card { background:#111827; border:1px solid #334155; border-radius:10px; padding:1rem; }
    h2 { margin:0 0 .75rem; font-size:1.1rem; color:#93c5fd }
    ul { margin:.5rem 0 0; padding-left:1.25rem }
    label { display:block; margin:.25rem 0 }
    input, select, button { padding:.5rem .6rem; border-radius:6px; border:1px solid #334155; background:#0b1220; color:#e2e8f0 }
    button { background:#0ea5e9; border-color:#0284c7; cursor:pointer }
    button.secondary { background:#334155; border-color:#475569 }
    table { width:100%; border-collapse: collapse; }
    th, td { padding:.4rem .5rem; border-bottom:1px solid #334155; text-align:left; font-size:.9rem }
  </style>
</head>
<body>
  <header>
    <div><a href="/">👻 Ghost</a> / Engine</div>
    <div>
      <label>Mode
        <select id="mode">
          <option>Sim</option>
          <option>Live</option>
        </select>
      </label>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Signals</h2>
      <div id="signals">Loading…</div>
    </section>
    <section class="card">
      <h2>Allocation Planner</h2>
      <label>Risk preset
        <select id="risk">
          <option>Conservative</option>
          <option selected>Moderate</option>
          <option>Aggressive</option>
        </select>
      </label>
      <label>Max position (USD)
        <input id="maxpos" type="number" step="50" value="1000" />
      </label>
      <button onclick="computeAllocations()">Compute</button>
      <div id="allocs" style="margin-top:.5rem"></div>
    </section>
    <section class="card">
      <h2>Execution Queue</h2>
      <div style="margin-bottom:.5rem">
        <button onclick="placeOrder()">Place Example Order</button>
        <button class="secondary" onclick="clearOrders()">Clear</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead>
        <tbody id="orders"></tbody>
      </table>
    </section>
  </main>
  <script>
    function fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:2}) }
    function loadSignals(){
      fetch('/api/signals').then(r=>r.json()).then(d=>{
        const el = document.getElementById('signals');
        el.innerHTML = '<ul>' + d.signals.map(s=>`<li>${s.symbol}: ${s.action} (${Math.round(s.confidence*100)}%) — entry ${fmt(s.entry)}, TP ${fmt(s.tp)}, SL ${fmt(s.sl)}</li>`).join('') + '</ul>'
      })
    }
    function computeAllocations(){
      const risk = document.getElementById('risk').value; const maxpos = document.getElementById('maxpos').value;
      fetch('/api/allocations/compute',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({risk_preset:risk, max_position_usd: Number(maxpos)})})
        .then(r=>r.json()).then(d=>{
          const el = document.getElementById('allocs');
          el.innerHTML = '<ul>' + d.allocations.map(a=>`<li>${a.symbol} ${a.action}: $${fmt(a.size_usd)}</li>`).join('') + '</ul>'
        })
    }
    function loadOrders(){
      fetch('/orders/queue').then(r=>r.json()).then(d=>{
        const tb = document.getElementById('orders'); tb.innerHTML='';
        d.pending.forEach(o=>{ tb.insertAdjacentHTML('beforeend', `<tr><td>${o.id}</td><td>${o.symbol}</td><td>${o.side}</td><td>${fmt(o.quantity)}</td><td>${fmt(o.price)}</td><td>${o.status}</td></tr>`) })
      })
    }
    function placeOrder(){
      fetch('/orders/place',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({symbol:'ETH', side:'BUY', quantity:0.5, price:2500})}).then(()=>loadOrders())
    }
    function clearOrders(){ fetch('/orders/clear',{method:'POST'}).then(()=>loadOrders()) }
    loadSignals(); computeAllocations(); loadOrders();
  </script>
</body>
</html>
