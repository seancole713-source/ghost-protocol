[project]
name = "repl-nix-workspace"
version = "0.3.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.100.0",
    "uvicorn[standard]==0.22.0",
    "jinja2==3.1.2",
    "pydantic==1.10.11",
    "requests>=2.31.0",
    "httpx==0.27.2",
    "yfinance==0.2.27",
    "web3>=7.13.0",
    "eth-account>=0.13.7",
    "qrcode>=8.2",
    "redis>=5.0.0",
    "prometheus-client>=0.21.0",
    "gunicorn>=23.0.0",
    "Pillow>=11.3.0",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "psutil>=7.0.0",
    "python-dotenv>=1.1.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.3.1",
    "defusedxml>=0.7.1",
    "python-telegram-bot>=21.6",  # optional; polling implemented manually (HTTP) but library available
]

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E","F","I","W","UP","B"]
ignore = ["E402", "B008", "E501", "B904", "B018", "F811", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["app","core"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
