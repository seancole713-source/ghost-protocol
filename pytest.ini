[pytest]
addopts = -p pytest_asyncio -p no:web3.tools.pytest_ethereum -p no:pytest_ethereum
timeout = 30
markers =
    timeout: enforce or document test timeout (requires pytest-timeout plugin)
asyncio_mode = auto
; Third-party plugin autoload disabled via sitecustomize.py. If you need a plugin,
; explicitly add it to requirements and import/enable it. PYTEST_DISABLE_PLUGIN_AUTOLOAD
; env var is set in sitecustomize.py so we no longer declare it here to avoid config warnings.
