{% extends 'base.html' %}
{% block title %}Ghost Intelligence Cockpit{% endblock %}
{% block content %}
<main class="layout">
  <section class="card" style="padding:1rem;">
  <div class="card-header">Ghost Intelligence Cockpit</div>
    <div class="card-body">
      <p>Welcome to Ghost. Use the controls below to inspect the running service.</p>
  <div id="statusBox"></div>
      <div style="margin-top:1rem;">
        <button class="btn" id="btnRefresh">Refresh</button>
        <a class="btn" href="/diagnostics/run">Run Diagnostics</a>
        <a class="btn" href="/logs/recent">View Logs</a>
        <a class="btn" href="/coins">Coins</a>
        <a class="btn" href="/stocks">Stocks</a>
      </div>
    </div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
async function loadStatus(){
  try{
    const r = await fetch('/source/status');
    const j = await r.json();
    const el = document.getElementById('statusBox');
    el.innerHTML = `<pre style="white-space:pre-wrap">${JSON.stringify(j, null, 2)}</pre>`;
  }catch(e){
    document.getElementById('statusBox').textContent = 'Failed to load status: '+e;
  }
}
window.addEventListener('load', ()=>{ loadStatus(); document.getElementById('btnRefresh').addEventListener('click', loadStatus); });
</script>
{% endblock %}
