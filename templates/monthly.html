{% extends 'base.html' %}
{% set active='monthly' %}
{% block title %}Monthly Report{% endblock %}
{% block content %}
<main class="layout" style="padding:1rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
  <section class="card">
    <div class="card-header">Monthly Summary</div>
    <div class="text-dim">Coming soon. Portfolio value: <span id="pv">-</span></div>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script>
(async function(){ try{ const s = await ghostFetch('/source/status'); document.getElementById('pv').textContent = (s.statistics?.portfolio_value||0).toLocaleString(); }catch(e){} })();
</script>
{% endblock %}
