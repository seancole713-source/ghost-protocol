name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (errors only)
        run: ruff check core/ config/ tests/ --select E9,F63,F7,F82 --no-fix

      - name: Ruff format check
        run: ruff format --check core/ config/ tests/ || echo "::warning::Formatting issues found (non-blocking)"
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=core --cov=config --cov=data --cov=api --cov-report=xml --cov-report=term-missing
      
      - name: Check coverage threshold
        run: |
          # Fail if coverage below 70%
          pytest tests/ --cov=core --cov=config --cov=data --cov-fail-under=70
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
