groups:
  - name: ghost-slo.rules
    interval: 30s
    rules:
      # Availability SLO: instance should be up
      - alert: GhostDown
        expr: ghost_up == 0
        for: 2m
        labels:
          severity: critical
          service: ghost-wolf
        annotations:
          summary: Ghost API is down
          description: ghost_up is 0 for >2 minutes.

      # Snapshot freshness: last /api/cockpit as_of should update regularly
      - alert: SnapshotStale
        expr: time() - ghost_snapshot_asof > 120
        for: 3m
        labels:
          severity: warning
          service: ghost-wolf
        annotations:
          summary: Cockpit snapshot is stale
          description: No fresh snapshot served in > 2 minutes.

      # Cockpit latency p95 SLO breach (example threshold 500ms)
      - record: job:ghost_cockpit_snapshot_build_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ghost_cockpit_snapshot_build_seconds_bucket[5m])) by (le)
          )
      - alert: CockpitLatencyHighP95
        expr: job:ghost_cockpit_snapshot_build_seconds:p95 > 0.5
        for: 5m
        labels:
          severity: warning
          service: ghost-wolf
        annotations:
          summary: High cockpit snapshot latency (p95)
          description: p95 build time > 500ms for 5 minutes.

      # Provider error budget (rolling error rate)
      - alert: ProviderErrorsHigh
        expr: |
          sum(rate(ghost_provider_fetch_total{result="error"}[5m]))
            /
          clamp_min(sum(rate(ghost_provider_fetch_total[5m])), 1)
          > 0.2
        for: 5m
        labels:
          severity: warning
          service: ghost-wolf
        annotations:
          summary: Provider error rate high
          description: More than 20% of provider fetches failing over 5 minutes.

      # Write throttle visibility: sustained 429s
      - alert: WriteRateLimitedSustained
        expr: rate(ghost_rate_limit_drops_total[5m]) > 0.1
        for: 10m
        labels:
          severity: info
          service: ghost-wolf
        annotations:
          summary: Sustained write rate limiting
          description: Rate-limited write requests detected for >10 minutes.
