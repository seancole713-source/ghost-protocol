# Ghost AI Agent Alert Rules
# Prometheus alert rules for monitoring the ChatGPT Analyst agent

groups:
  - name: ghost_agent_health
    interval: 5m
    rules:
      # Agent has stopped making decisions (critical)
      - alert: GhostAgentStale
        expr: (time() - ghost_ai_decision_last_ts) > 86400
        for: 10m
        labels:
          severity: critical
          component: agent
          team: ghost-ai
        annotations:
          summary: "Ghost Agent has not made decisions in 24+ hours"
          description: |
            The Ghost AI Agent has not logged any decisions in over 24 hours.
            Last decision timestamp: {{ $value | humanizeTimestamp }}
            
            Possible causes:
            - Agent loop crashed or stopped
            - OpenAI API key invalid or rate limited
            - Database connection issues
            - OPENAI_API_KEY environment variable missing
            
            Actions:
            1. Check agent health: GET /agent/health
            2. Check Railway logs for errors
            3. Verify OPENAI_API_KEY is set
            4. Restart Ghost service if needed
          runbook_url: "https://github.com/your-repo/docs/runbooks/agent_stale.md"
      
      # Low decision confidence sustained (warning)
      - alert: GhostAgentLowConfidence
        expr: avg_over_time(ghost_ai_decision_confidence[1h]) < 0.5
        for: 30m
        labels:
          severity: warning
          component: agent
          team: ghost-ai
        annotations:
          summary: "Agent decision confidence below 50% for 30+ minutes"
          description: |
            The Ghost AI Agent is producing low-confidence decisions.
            Current average confidence: {{ $value | humanizePercentage }}
            
            Possible causes:
            - High market volatility or uncertainty
            - Lack of clear signals from market data
            - Model quality degradation
            - Insufficient context in conversation history
            
            Actions:
            1. Review recent decisions: GET /api/ai/decisions?hours=2
            2. Check market conditions (VIX, news sentiment)
            3. Review agent reasoning in recent decisions
            4. Consider adjusting system prompt or context
          runbook_url: "https://github.com/your-repo/docs/runbooks/low_confidence.md"
      
      # High tool failure rate (warning)
      - alert: GhostAgentToolFailures
        expr: |
          (
            rate(ghost_ai_tool_calls_total{result="failure"}[5m])
            /
            rate(ghost_ai_tool_calls_total[5m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: agent
          team: ghost-ai
        annotations:
          summary: "Agent tool failure rate above 20%"
          description: |
            {{ $value | humanizePercentage }} of agent tool calls are failing.
            
            Possible causes:
            - Market data provider API issues (Polygon, AlphaVantage)
            - Rate limiting on external APIs
            - Network connectivity problems
            - Invalid API keys
            - Tool implementation bugs
            
            Actions:
            1. Check tool metrics: GET /api/ai/monitor
            2. Verify API keys are valid
            3. Check provider status pages
            4. Review error logs for specific failures
            5. Test individual tools manually
          runbook_url: "https://github.com/your-repo/docs/runbooks/tool_failures.md"
      
      # Tool latency spike (warning)
      - alert: GhostAgentToolLatency
        expr: |
          histogram_quantile(0.95,
            rate(ghost_ai_tool_latency_seconds_bucket[5m])
          ) > 5.0
        for: 10m
        labels:
          severity: warning
          component: agent
          team: ghost-ai
        annotations:
          summary: "Agent tool latency p95 exceeds 5 seconds"
          description: |
            Tool calls are taking longer than expected (p95: {{ $value }}s).
            
            Possible causes:
            - Market data provider slowdowns
            - Network latency issues
            - Database query performance degradation
            - Resource constraints (CPU, memory)
            
            Actions:
            1. Check tool metrics by provider: GET /api/ai/monitor
            2. Review Railway resource utilization
            3. Check provider status pages for incidents
            4. Consider increasing HTTP_TIMEOUT_S if appropriate
            5. Review slow query logs
          runbook_url: "https://github.com/your-repo/docs/runbooks/tool_latency.md"
      
      # Agent not invoking tools (warning)
      - alert: GhostAgentNotFetchingData
        expr: rate(ghost_ai_tool_calls_total[10m]) == 0
        for: 30m
        labels:
          severity: warning
          component: agent
          team: ghost-ai
        annotations:
          summary: "Agent not invoking any tools for 30+ minutes"
          description: |
            The Ghost AI Agent has not made any tool calls recently.
            This may indicate the agent loop is paused, idle, or stuck.
            
            Possible causes:
            - Agent tick interval too long (check GHOST_AGENT_TICK)
            - Agent loop stuck in conversation phase
            - No portfolio positions to monitor
            - Agent disabled (check AI_ON environment variable)
            
            Actions:
            1. Check agent state: GET /agent/state
            2. Verify GHOST_AGENT_TICK is set to 300s (5min)
            3. Check AI_ON=1 in environment
            4. Review conversation history for stuck loops
            5. Check portfolio status: GET /api/cockpit
          runbook_url: "https://github.com/your-repo/docs/runbooks/agent_idle.md"
  
  - name: ghost_agent_quality
    interval: 15m
    rules:
      # Very low confidence decisions (info)
      - alert: GhostAgentVeryLowConfidence
        expr: ghost_ai_decision_confidence < 0.3
        for: 5m
        labels:
          severity: info
          component: agent
          team: ghost-ai
        annotations:
          summary: "Latest agent decision has very low confidence"
          description: |
            The most recent AI decision has confidence {{ $value | humanizePercentage }}.
            
            This is informational only - review the decision rationale to understand why.
            
            Actions:
            1. Review decision: GET /api/ai/decisions?hours=1
            2. Check decision rationale and risks
            3. Verify market data quality
          runbook_url: "https://github.com/your-repo/docs/runbooks/decision_review.md"
      
      # High decision churn (info)
      - alert: GhostAgentHighDecisionRate
        expr: rate(ghost_ai_decisions_total[5m]) > 0.5
        for: 15m
        labels:
          severity: info
          component: agent
          team: ghost-ai
        annotations:
          summary: "Agent making decisions very frequently"
          description: |
            The agent is making {{ $value }} decisions per second.
            
            This may indicate:
            - Rapid market changes triggering frequent analysis
            - Agent tick interval too short
            - Agent unstable (oscillating between decisions)
            
            Actions:
            1. Review recent decisions: GET /api/ai/decisions?hours=1
            2. Check for decision oscillation (BUY → SELL → BUY)
            3. Consider increasing GHOST_AGENT_TICK if appropriate
          runbook_url: "https://github.com/your-repo/docs/runbooks/decision_churn.md"

