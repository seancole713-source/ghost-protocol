[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Railway provides $PORT - wolf_app.py reads it via os.getenv
startCommand = "python3 wolf_app.py"

# Daily backup cron - runs at 3 AM UTC every day
# Backs up ghost databases to Railway persistent volume
# Keeps last 7 days of backups, auto-cleans old files
[[deploy.cron]]
schedule = "0 3 * * *"
command = "python scripts/railway_backup.py"
# Force rebuild Tue Oct 14 11:39:43 CDT 2025
# Force rebuild Tue Oct 14 12:06:36 CDT 2025
# Force rebuild: NEWS router deployment Tue Oct 14 13:04:54 CDT 2025
# Force rebuild: News endpoints deployment Tue Oct 14 15:01:48 CDT 2025
# Force Railway to fetch latest commits: Tue Oct 14 16:46:38 CDT 2025
