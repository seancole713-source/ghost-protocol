[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck aligned with Ghost live endpoint
healthcheckPath = "/health"
healthcheckTimeout = 100

# Restart policy to auto-recover failed deployments
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Start command using Railway's PORT variable with fallback to 8080
startCommand = "sh -c 'uvicorn wolf_app:APP --host 0.0.0.0 --port ${PORT:-8080}'"

# Daily backup cron – runs at 3 AM UTC every day
# Backs up Ghost databases to Railway persistent volume
# Keeps last 7 days of backups, auto-cleans old files
[[deploy.cron]]
schedule = "0 3 * * *"
command = "python scripts/railway_backup.py"
 