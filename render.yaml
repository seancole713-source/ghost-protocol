services:
  - type: web
    name: ghost-trading
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn wolf_app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GHOST_API_TOKEN
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: GHOST_FOCUS_TICKER
        value: WOLF
      - key: WOLF_PERSIST_MODE
        value: sqlite
      - key: WOLF_SQLITE_PATH
        value: /opt/render/project/src/data/wolf.db
